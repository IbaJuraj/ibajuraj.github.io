name: Validate portal
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_portal.py
      - run: node --check portal.js && node --check i18n.js
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test mobile and desktop portal
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/portal-server.log 2>&1 &
          node tools/portal_browser_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-mobile-preview
          path: portal-preview/
  live-metadata-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read published Apple metadata without writing to GitHub
        run: |
          python3 tools/sync_appstore.py
          python3 tools/test_portal.py
          python3 -c 'import json; d=json.load(open("assets/appstore/catalog.json")); print("Live App Store entries:", len(d["apps"])); assert d["apps"], "No live metadata received"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore-metadata-preview
          path: assets/appstore/
