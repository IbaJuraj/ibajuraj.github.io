name: Apply website Standard 1.6.0 refresh v2

on:
  push:
    branches:
      - web/standard-1.6.0-refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v4
        with:
          ref: web/standard-1.6.0-refresh
          fetch-depth: 0

      - name: Apply refresh
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Main page.
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = re.sub(r'\n\s*<link rel="stylesheet" href="style-151\.css\?v=[^"]+">', '', text)
          text = text.replace('data-standard-version aria-live="polite">1.5.1</strong>', 'data-standard-version aria-live="polite">1.6.0</strong>')
          text = text.replace('https://github.com/IbaJuraj/ibajuraj-application-standard/blob/standard-v1.5.1/IBAJURAJ_APPLICATION_STANDARD.md', 'https://github.com/IbaJuraj/ibajuraj-application-standard/blob/standard-v1.6.0/IBAJURAJ_APPLICATION_STANDARD.md')
          base_copy = '<p>Spoločné pravidlá pre vzhľad, nastavenia, navigáciu, prístupnosť, súkromie a kvalitu pomáhajú, aby sa naše aplikácie ovládali podobne.</p>'
          gradual = '<p class="app-note">Najnovší autoritatívny Standard je 1.6.0. Jednotlivé aplikácie ho zavádzajú postupne.</p>'
          if gradual not in text and base_copy in text:
              text = text.replace(base_copy, base_copy + '\n          ' + gradual)
          index.write_text(text, encoding='utf-8')

          # Metadata loader only accepts an active published Standard.
          script = Path('script.js')
          js = script.read_text(encoding='utf-8')
          marker = '      const metadata = await response.json();\n      const version = typeof metadata.version === "string" ? metadata.version.trim() : "";'
          replacement = '      const metadata = await response.json();\n      const metadataStatus = typeof metadata.status === "string" ? metadata.status.trim().toLowerCase() : "";\n      if (metadataStatus !== "active") throw new Error("Standard metadata is not active");\n      const version = typeof metadata.version === "string" ? metadata.version.trim() : "";'
          if 'Standard metadata is not active' not in js and marker in js:
              js = js.replace(marker, replacement)
          script.write_text(js, encoding='utf-8')

          # Merge old visual override into the main stylesheet and remove version-specific CSS file.
          style = Path('style.css')
          override = Path('style-151.css')
          if override.exists():
              base = style.read_text(encoding='utf-8').rstrip()
              extra = override.read_text(encoding='utf-8').replace('/* IbaJuraj Apps — Standard 1.5.1 desktop/mobile polish overrides */', '/* IbaJuraj Apps — desktop/mobile polish overrides */').strip()
              if '/* IbaJuraj Apps — desktop/mobile polish overrides */' not in base:
                  style.write_text(base + '\n\n' + extra + '\n', encoding='utf-8')
              override.unlink()

          # Version-independent cache keys on every HTML page.
          cache_pattern = re.compile(r'(?P<asset>(?:style(?:-[A-Za-z0-9._-]+)?\.css|script\.js))\?v=[^"\']+')
          for html in root.rglob('*.html'):
              h = html.read_text(encoding='utf-8')
              h = cache_pattern.sub(lambda m: f"{m.group('asset')}?v=20260817-web-refresh", h)
              html.write_text(h, encoding='utf-8')

          # Replace local Standard archive with a non-authoritative redirect/pointer only.
          Path('standard/index.html').write_text('''<!doctype html>
          <html lang="sk">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <meta http-equiv="refresh" content="3;url=https://github.com/IbaJuraj/ibajuraj-application-standard/releases/tag/standard-v1.6.0">
            <title>IbaJuraj Application Standard – presunuté</title>
            <style>
              :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
              body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fc; color: #0c1730; }
              main { width: min(640px, calc(100% - 40px)); padding: 36px; border: 1px solid #d8e0ef; border-radius: 28px; background: white; box-shadow: 0 20px 60px rgba(23,54,112,.10); }
              h1 { margin: 0 0 16px; font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1; }
              p { color: #5d6b84; font-size: 1.08rem; line-height: 1.6; }
              a { display: inline-block; margin-top: 12px; padding: 14px 20px; border-radius: 999px; background: #1769e8; color: white; font-weight: 700; text-decoration: none; }
              @media (prefers-color-scheme: dark) { body { background:#0c1220; color:#f5f7fb; } main { background:#141d30; border-color:#273650; } p { color:#b7c2d5; } }
            </style>
          </head>
          <body>
            <main>
              <p>IbaJuraj Apps</p>
              <h1>Štandard bol presunutý.</h1>
              <p>Jediným autoritatívnym zdrojom IbaJuraj Application Standardu je samostatný GitHub repozitár. Aktuálne finálne vydanie je 1.6.0. Jednotlivé aplikácie ho adoptujú vlastným release procesom.</p>
              <a href="https://github.com/IbaJuraj/ibajuraj-application-standard/releases/tag/standard-v1.6.0">Otvoriť Standard 1.6.0</a>
            </main>
          </body>
          </html>
          ''', encoding='utf-8')

          Path('standard/README.md').write_text('''# IbaJuraj Application Standard – presunuté

          Tento priečinok **nie je autoritatívnym zdrojom** IbaJuraj Application Standardu.

          Jediný autoritatívny zdroj:
          https://github.com/IbaJuraj/ibajuraj-application-standard

          Aktuálne finálne vydanie:
          - verzia: **1.6.0**
          - tag: `standard-v1.6.0`
          - release: https://github.com/IbaJuraj/ibajuraj-application-standard/releases/tag/standard-v1.6.0

          Jednotlivé aplikácie prijímajú nové verzie Standardu samostatne; existencia novšieho Standardu sama osebe neznamená, že ho už používa každá aplikácia.
          ''', encoding='utf-8')

          Path('README.md').write_text('''# IbaJuraj Apps

          Oficiálna prezentačná a podporná stránka aplikácií IbaJuraj Apps.

          ## Aplikácie

          - Strážca Termínov – dostupný v App Store
          - Lex Drive – dostupný v App Store
          - Kalkulačka 2v1 – dostupná v App Store
          - Peňaženka Kariet – vo vývoji

          ## Obsah repozitára

          - `index.html` – hlavná responzívna stránka,
          - `style.css` – spoločný desktop, tablet a mobilný dizajn,
          - `script.js` – navigácia, podpora kontaktného formulára a dynamické metadata Standardu,
          - `privacy.html` – zásady ochrany súkromia,
          - `invite.html` – vstupná stránka pozvánok,
          - `404.html` – vlastná chybová stránka,
          - `assets/` – ikony aplikácií a webu,
          - `standard/` – neautoritatívny redirect na samostatný repozitár Standardu.

          ## IbaJuraj Application Standard

          Autoritatívnym zdrojom je samostatný repozitár:
          https://github.com/IbaJuraj/ibajuraj-application-standard

          Hlavná stránka načítava aktuálnu aktívnu verziu z `standard.json` v autoritatívnom repozitári. HTML obsahuje iba fallback pre prípad nedostupnosti GitHub metadata endpointu.

          Aktuálne finálne vydanie pri tejto aktualizácii webu je **1.6.0** (`standard-v1.6.0`). Jednotlivé aplikácie Standard adoptujú vlastným release procesom a nemusia všetky používať rovnakú verziu.

          ## Odkazy z aplikácií na podporu

          Kontaktný formulár podporuje parametre `app`, `type` a nepovinný `subject`.

          Príklad:
          `https://ibajuraj.github.io/?app=lexdrive&type=technical&subject=Problém%20s%20vyhľadávaním#support`

          Stabilné identifikátory aplikácií sú `strazca-terminov`, `lexdrive`, `jurajcalc`, `penazenka-kariet` a `general`. Podporované typy sú `question`, `technical`, `content`, `suggestion`, `privacy` a `other`.

          ## Publikovanie

          Zmeny webu sa pripravujú na samostatnej vetve, skontrolujú sa a následne sa mergujú do `main` cez pull request. GitHub Pages publikuje obsah z koreňa vetvy `main`.

          ## Podpora

          Kontaktný formulár používa Formspree. Telegram komunita je doplnkový komunikačný kanál; citlivé údaje sa nemajú posielať cez verejné komunikačné kanály.
          ''', encoding='utf-8')

          Path('SETUP.md').write_text('''# Nastavenie a kontrola stránky

          Pred každým vydaním webu skontrolujte, že:

          1. endpoint Formspree v `index.html` je stále aktívny,
          2. pozývací odkaz Telegramu je platný,
          3. odkazy na aplikácie smerujú na ich aktuálne stránky v App Store,
          4. `standard.json` v autoritatívnom repozitári obsahuje aktuálnu aktívnu verziu Standardu,
          5. web netvrdí, že všetky aplikácie používajú najnovší Standard, pokiaľ to nie je overené,
          6. stránka sa overila aspoň pri šírkach 320, 375, 768, 1024 a 1440 px,
          7. funguje klávesnicová navigácia, mobilné menu, kontakt a základné focus stavy.

          ## Publikovanie

          Produkčný GitHub Pages web používa vetvu `main` a koreň repozitára. Zmeny sa pripravujú na samostatnej vetve a do `main` sa dostávajú cez pull request po kontrole.
          ''', encoding='utf-8')

          Path('sitemap.xml').write_text('''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://ibajuraj.github.io/</loc>
              <lastmod>2026-08-17</lastmod>
              <changefreq>monthly</changefreq>
              <priority>1.0</priority>
            </url>
            <url>
              <loc>https://ibajuraj.github.io/privacy.html</loc>
              <lastmod>2026-08-17</lastmod>
              <changefreq>yearly</changefreq>
              <priority>0.6</priority>
            </url>
          </urlset>
          ''', encoding='utf-8')

          for stale in [
              'README_REPLACE.md',
              'UPLOAD_INSTRUCTIONS.md',
              'standard/CHANGELOG.md',
              'standard/GOVERNANCE.md',
              'standard/IBAJURAJ_APPLICATION_STANDARD.md',
              'standard/SUPPORT_AND_LINKS.md',
          ]:
              p = Path(stale)
              if p.exists():
                  p.unlink()
          PY

      - name: Validate refreshed source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f style.css
          test -f script.js
          test -f standard/index.html
          test ! -f style-151.css
          test ! -f standard/IBAJURAJ_APPLICATION_STANDARD.md
          grep -q 'data-standard-version aria-live="polite">1.6.0</strong>' index.html
          grep -q 'Jednotlivé aplikácie ho zavádzajú postupne' index.html
          grep -q 'standard-v1.6.0' standard/index.html
          grep -q 'metadataStatus !== "active"' script.js
          if grep -R -n -E 'standard-v1\.5\.1|Standard 1\.5\.1|Štandard 1\.5\.1|style-151\.css|standard-130|standard-151|Aktuálna stabilná verzia.*1\.3\.0' --exclude-dir=.git --exclude-dir=.github .; then
            echo 'Found stale Standard/version-specific website references.'
            exit 1
          fi

      - name: Commit refresh and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-web-standard-160-refresh-v2.yml
          git config user.name "IbaJuraj"
          git config user.email "134379854+IbaJuraj@users.noreply.github.com"
          git add -A
          git commit -m "Refresh website for Standard 1.6.0"
          git push origin HEAD:web/standard-1.6.0-refresh
