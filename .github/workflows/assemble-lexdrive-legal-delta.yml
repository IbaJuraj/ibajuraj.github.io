name: Assemble Lex Drive September 2026 legal delta

on:
  push:
    branches:
      - lexdrive/legal-2026-09-01-candidate
    paths:
      - lexdrive/legal/candidate/ASSEMBLE_2026_09_01_DELTA

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexdrive/legal-2026-09-01-candidate
      - name: Assemble and verify package
        shell: bash
        run: |
          set -euo pipefail
          DIR="lexdrive/legal/candidate/2026-09-01-delta"
          DST="lexdrive/legal/production/packages/SK-2026.09.01-production.1-production.lexlegal.json"
          mkdir -p "$(dirname "$DST")"
          cat "$DIR/part.00" "$DIR/part.01a" "$DIR/part.01b" "$DIR/part.01c" "$DIR/part.01d" | base64 -d | xz -d > "$DST"
          ACTUAL="$(sha256sum "$DST" | awk '{print $1}')"
          EXPECTED="14ac1e1ff7100a8d1b3111bb85992269d134f4fc9f1856546765a2f2e469932a"
          test "$ACTUAL" = "$EXPECTED"
          test "$(wc -c < "$DST" | tr -d ' ')" = "93085"
      - name: Commit assembled candidate package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexdrive/legal/production/packages/SK-2026.09.01-production.1-production.lexlegal.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Assemble Lex Drive 2026-09-01 legal delta candidate"
          git push origin HEAD:lexdrive/legal-2026-09-01-candidate
