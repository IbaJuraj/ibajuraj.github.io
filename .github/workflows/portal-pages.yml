name: Update App Store and publish portal
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: portal-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Refresh published metadata
        run: python3 tools/sync_appstore.py
      - name: Check portal
        run: |
          python3 tools/test_portal.py
          node --check portal.js
          node --check i18n.js
          node --check script.js
      - name: Store last valid metadata
        if: vars.ENABLE_PORTAL_PAGES_DEPLOY == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/appstore
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh published App Store metadata'
            git push origin HEAD:main
          fi
      - name: Prepare static site
        run: |
          mkdir -p /tmp/portal-site
          git archive HEAD | tar -x -C /tmp/portal-site
          cp -a assets/appstore /tmp/portal-site/assets/
          rm -rf /tmp/portal-site/.github
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_PORTAL_PAGES_DEPLOY == 'true'
        with:
          path: /tmp/portal-site
  deploy:
    if: vars.ENABLE_PORTAL_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
