name: Update App Store and publish portal
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: portal-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    outputs:
      catalog_sha: ${{ steps.catalog_revision.outputs.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Refresh published metadata
        run: python3 tools/sync_appstore.py
      - name: Check portal
        run: |
          python3 tools/test_portal.py
          node --check portal.js
          node --check i18n.js
          node --check script.js
      - name: Store last valid metadata
        if: vars.ENABLE_PORTAL_PAGES_DEPLOY == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/appstore
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh published App Store metadata'
            git push origin HEAD:main
          fi
      - name: Record catalog revision
        id: catalog_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare static site
        run: |
          mkdir -p /tmp/portal-site
          git archive HEAD | tar -x -C /tmp/portal-site
          cp -a assets/appstore /tmp/portal-site/assets/
          rm -rf /tmp/portal-site/.github
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_PORTAL_PAGES_DEPLOY == 'true'
        with:
          path: /tmp/portal-site
  deploy:
    if: vars.ENABLE_PORTAL_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  telegram:
    needs: [build, deploy]
    if: vars.ENABLE_PORTAL_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify deployed metadata and test release logic
        env:
          DEPLOYED_SHA: ${{ needs.build.outputs.catalog_sha }}
        run: |
          git diff --exit-code "$DEPLOYED_SHA" HEAD -- assets/appstore/catalog.json
          python3 tools/test_telegram_release.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Preview only (default)
        if: vars.ENABLE_TELEGRAM_RELEASES != 'true'
        run: python3 tools/telegram_release.py --mode preview
      - name: Publish new release
        if: vars.ENABLE_TELEGRAM_RELEASES == 'true'
        env:
          ENABLE_TELEGRAM_RELEASES: ${{ vars.ENABLE_TELEGRAM_RELEASES }}
          TELEGRAM_RELEASE_BOT_TOKEN: ${{ secrets.TELEGRAM_RELEASE_BOT_TOKEN }}
          TELEGRAM_RELEASE_CHAT_ID: ${{ secrets.TELEGRAM_RELEASE_CHAT_ID }}
        run: python3 tools/telegram_release.py --mode publish
