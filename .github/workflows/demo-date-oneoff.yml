name: One-time demo date correction (PR only)
on:
  push:
    branches: [fix/website-content-i18n-2026-10-30]
    paths: [.github/workflows/demo-date-oneoff.yml]
permissions:
  contents: write
jobs:
  patch-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python3 -m pip install --quiet Pillow
      - name: Safely correct demo data and update manifest SHA
        run: python3 tools/normalize_demo_insurance_date.py
      - name: Commit corrected media, remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/demo-date-oneoff.yml
          git add assets/screenshots/strazca-terminov-2.webp assets/screenshots/manifest.json
          git commit -m 'assets(web): align fictional insurance date with 214-day term'
          git push origin HEAD:fix/website-content-i18n-2026-10-30
